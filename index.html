<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080810">
  <meta name="description" content="AI M — مساعدك الذكي">
  <title>AI M — AI Assistant</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">M<span>.</span></div>
        <div><div class="brand-name">AI M</div><div class="brand-caption">YOUR AI SPACE</div></div>
      </div>
      <button class="new-chat" id="newChat"><span>＋</span><span data-i18n="newChat">محادثة جديدة</span></button>
      <div class="side-label" data-i18n="recent">الأخيرة</div>
      <div id="chatList" class="chat-list"></div>
      <div class="sidebar-bottom">
        <div class="status-dot"></div><span data-i18n="ready">جاهز للمحادثة</span>
        <button id="languageToggle" class="language-toggle" aria-label="Switch language">EN</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuButton" aria-label="Open menu">☰</button>
        <div class="mobile-brand"><span class="mini-mark">M.</span> AI M</div>
        <div class="topbar-right">
          <span class="model-pill"><span class="pulse"></span><span data-i18n="preview">معاينة الواجهة</span></span>
          <button id="clearButton" class="icon-button" title="Clear chat" aria-label="Clear chat">↺</button>
        </div>
      </header>

      <section class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <div class="hero-orb"><div class="orb-core">M<span>.</span></div><div class="orb-ring ring-a"></div><div class="orb-ring ring-b"></div></div>
          <div class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="eyebrow">مساعدك الذكي، بطريقتك</span><span class="eyebrow-line"></span></div>
          <h1><span data-i18n="headline1">فكّر أبعد.</span><br><span class="gradient-text" data-i18n="headline2">اصنع المستحيل.</span></h1>
          <p class="welcome-copy" data-i18n="welcomeCopy">اسأل، استكشف، وابنِ أفكارك. مساحة واحدة لإبداعك وإنتاجيتك.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt-ar="اشرح لي الذكاء الاصطناعي بطريقة بسيطة" data-prompt-en="Explain artificial intelligence simply"><span class="suggestion-icon purple">✦</span><span data-i18n="suggest1">اشرح لي فكرة معقدة ببساطة</span><span class="suggestion-arrow">↗</span></button>
            <button class="suggestion" data-prompt-ar="اكتب لي خطة لتعلم البرمجة من الصفر" data-prompt-en="Create a plan to learn programming from scratch"><span class="suggestion-icon blue">⌘</span><span data-i18n="suggest2">ساعدني أتعلم البرمجة</span><span class="suggestion-arrow">↗</span></button>
            <button class="suggestion" data-prompt-ar="اقترح أفكار مشاريع مبتكرة بميزانية قليلة" data-prompt-en="Suggest innovative projects on a small budget"><span class="suggestion-icon pink">◇</span><span data-i18n="suggest3">اقترح أفكار مشاريع جديدة</span><span class="suggestion-arrow">↗</span></button>
            <button class="suggestion" data-prompt-ar="ساعدني أرتب يومي وأحدد أولوياتي" data-prompt-en="Help me organize my day and priorities"><span class="suggestion-icon cyan">◷</span><span data-i18n="suggest4">نظّم يومي وأولوياتي</span><span class="suggestion-arrow">↗</span></button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="اكتب رسالتك إلى AI M..." data-i18n-placeholder="inputPlaceholder"></textarea>
          <div class="composer-bottom">
            <div class="composer-tools"><span class="composer-hint" data-i18n="hint">AI M قد يخطئ — راجع المعلومات المهمة</span></div>
            <button class="send-button" id="sendButton" type="submit" aria-label="Send message"><span data-i18n="send">إرسال</span><span class="send-icon">↑</span></button>
          </div>
        </form>
        <div class="footer-note"><span class="tiny-shield">◇</span><span data-i18n="footer">مساحتك الخاصة للأفكار. لا تشارك بيانات حساسة.</span></div>
      </footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
