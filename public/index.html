
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030716">
  <meta name="description" content="AI M - Your futuristic AI assistant">
  <title>AI M — Future Intelligence</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">M</div>
        <span>AI M</span>
        <button id="closeSidebar" class="mobile-close">×</button>
      </div>

      <button id="newChat" class="new-chat">＋ محادثة جديدة</button>

      <div class="side-label" data-ar="محادثاتك" data-en="Your chats">محادثاتك</div>
      <div id="history" class="history"></div>

      <div class="side-bottom">
        <button id="languageBtn">🌐 English</button>
        <div class="profile">✦ AI M Assistant</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button>
        <div class="top-title">AI M <span class="status-dot"></span></div>
        <button id="clearBtn" class="icon-btn" aria-label="مسح المحادثة">⌫</button>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-orbit">
            <div class="welcome-logo">M</div>
          </div>

          <div class="eyebrow">YOUR PERSONAL AI UNIVERSE</div>

          <h1 data-ar="أهلاً بك في AI M" data-en="Welcome to AI M">
            أهلاً بك في AI M
          </h1>

          <p data-ar="مستقبلك الذكي يبدأ من هنا." data-en="Your intelligent future starts here.">
            مستقبلك الذكي يبدأ من هنا.
          </p>

          <div class="suggestions">
            <button class="suggestion" data-prompt-ar="اكتب لي خطة لتعلم البرمجة" data-prompt-en="Write me a programming learning plan">
              <span class="suggestion-icon">⌘</span>
              <span>تعلم البرمجة</span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button class="suggestion" data-prompt-ar="اشرح لي الذكاء الاصطناعي" data-prompt-en="Explain artificial intelligence">
              <span class="suggestion-icon">✧</span>
              <span>الذكاء الاصطناعي</span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button class="suggestion" data-prompt-ar="ساعدني في كتابة مشروع" data-prompt-en="Help me write a project">
              <span class="suggestion-icon">⌁</span>
              <span>كتابة مشروع</span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button class="suggestion" data-prompt-ar="اقترح أفكارًا جديدة" data-prompt-en="Suggest new ideas">
              <span class="suggestion-icon">✳</span>
              <span>أفكار جديدة</span>
              <span class="suggestion-arrow">↗</span>
            </button>
          </div>
        </div>

        <div id="messages" class="messages"></div>
      </section>

      <footer class="composer-wrap">
        <form id="chatForm" class="composer">
          <button class="attach-btn" type="button" aria-label="إضافة">＋</button>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="اكتب رسالتك إلى AI M..."
            aria-label="رسالتك"
          ></textarea>

          <button id="sendBtn" type="submit" aria-label="إرسال">➤</button>
        </form>

        <p class="disclaimer"
          data-ar="AI M قد يخطئ أحيانًا. راجع المعلومات المهمة."
          data-en="AI M can make mistakes. Check important information.">
          AI M قد يخطئ أحيانًا. راجع المعلومات المهمة.
        </p>
      </footer>
    </main>
  </div>

  <script type="module" src="/room3d.js"></script>
  <script src="/app.js"></script>
</body>
</html>
