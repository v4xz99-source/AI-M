
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050611">
  <meta name="description" content="AI M — ادخل عالم الذكاء الاصطناعي التفاعلي.">
  <title>AI M — Enter Another World</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <button id="closeSidebar" type="button" aria-label="إغلاق القائمة">
        ✕
      </button>

      <div class="brand">
        <div class="brand-icon">M</div>
        <div>
          <div class="brand-name">AI M</div>
          <div class="brand-subtitle">BEYOND THE KNOWN</div>
        </div>
      </div>

      <button id="newChat" type="button">
        <span>＋</span>
        <span data-ar="محادثة جديدة" data-en="New conversation">محادثة جديدة</span>
      </button>

      <div class="sidebar-label"
           data-ar="محادثاتك" data-en="YOUR CONVERSATIONS">
        محادثاتك
      </div>

      <div id="history"></div>

      <div class="sidebar-bottom">
        <button id="languageBtn" type="button">🌐 English</button>
      </div>
    </aside>

    <!-- Main application -->
    <main class="main">

      <!-- Top navigation -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuBtn" type="button" aria-label="فتح القائمة">
            ☰
          </button>

          <div class="top-brand">AI M</div>

          <div class="universe-label"
               data-ar="عالم بلا حدود"
               data-en="A LIMITLESS WORLD">
            عالم بلا حدود
          </div>
        </div>

        <div class="topbar-right">
          <button id="clearBtn" type="button"
                  data-ar="＋ جديد"
                  data-en="＋ New">
            ＋ جديد
          </button>
        </div>
      </header>

      <!-- Chat and welcome area -->
      <section class="chat-area" id="chatArea">
        <div class="universe-caption"
             data-ar="بوابة AI M · العالم التفاعلي"
             data-en="AI M GATE · INTERACTIVE WORLD">
          بوابة AI M · العالم التفاعلي
        </div>

        <!-- Welcome screen -->
        <section id="welcome">
          <div class="core-emblem" aria-hidden="true">
            <span class="core-letter">M</span>
          </div>

          <h1>
            <span>AI</span> M
          </h1>

          <p class="welcome-description"
             data-ar="عالم جديد يبدأ من هنا. اسأل، اكتشف، وابنِ أفكارك داخل تجربة ذكاء اصطناعي مختلفة."
             data-en="A new world begins here. Ask, explore, and build your ideas in a different AI experience.">
            عالم جديد يبدأ من هنا. اسأل، اكتشف، وابنِ أفكارك داخل تجربة ذكاء اصطناعي مختلفة.
          </p>

          <!-- Suggested prompts -->
          <div class="suggestions">
            <button class="suggestion" type="button"
              data-prompt-ar="عرّفني بنفسك، وإيه اللي تقدر تساعدني فيه؟"
              data-prompt-en="Introduce yourself and tell me how you can help.">
              عرّفني بنفسك، وإيه اللي تقدر تساعدني فيه؟
            </button>

            <button class="suggestion" type="button"
              data-prompt-ar="ساعدني أحوّل فكرة عندي لمشروع حقيقي."
              data-prompt-en="Help me turn an idea into a real project.">
              ساعدني أحوّل فكرة عندي لمشروع حقيقي.
            </button>

            <button class="suggestion" type="button"
              data-prompt-ar="اشرحلي موضوع صعب بطريقة بسيطة."
              data-prompt-en="Explain a difficult topic in a simple way.">
              اشرحلي موضوع صعب بطريقة بسيطة.
            </button>

            <button class="suggestion" type="button"
              data-prompt-ar="خلينا نبدأ محادثة جديدة."
              data-prompt-en="Let's start a new conversation.">
              خلينا نبدأ محادثة جديدة.
            </button>
          </div>
        </section>

        <!-- Messages are inserted here by app.js -->
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <!-- Message composer -->
      <footer class="composer-wrap">
        <div class="composer-aura" aria-hidden="true"></div>

        <form id="chatForm" class="composer">
          <textarea
            id="messageInput"
            name="message"
            rows="1"
            maxlength="12000"
            placeholder="اكتب رسالتك هنا..."
            aria-label="رسالتك"
            autocomplete="off"
            required
          ></textarea>

          <button
            id="sendBtn"
            type="submit"
            aria-label="إرسال الرسالة"
            title="إرسال"
          >
            <svg
              width="21"
              height="21"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M5 12L19 5L14 19L11.5 12.5L5 12Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <path
                d="M11.5 12.5L19 5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </form>

        <div class="disclaimer"
          data-ar="AI M قد يخطئ أحيانًا. راجع المعلومات المهمة."
          data-en="AI M can make mistakes. Check important information.">
          AI M قد يخطئ أحيانًا. راجع المعلومات المهمة.
        </div>
      </footer>

    </main>
  </div>

  <!-- 3D world -->
  <script type="module" src="/room3d.js"></script>

  <!-- Chat application -->
  <script src="/app.js"></script>
</body>
</html>
