
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030611">
  <meta name="description" content="AI M — Enter a new digital universe">
  <title>AI M — Beyond the Ordinary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">M</div>
        <div class="brand-copy">
          <span class="brand-name">AI M</span>
          <span class="brand-subtitle">BEYOND THE ORDINARY</span>
        </div>
        <button id="closeSidebar" class="mobile-close" type="button" aria-label="إغلاق القائمة">×</button>
      </div>

      <button id="newChat" class="new-chat" type="button">
        <span class="nav-icon">＋</span>
        <span>محادثة جديدة</span>
      </button>

      <div class="side-label" data-ar="مساحتك الرقمية" data-en="Your universe">
        مساحتك الرقمية
      </div>

      <nav class="side-nav">
        <button class="nav-item active" type="button" data-ar="الرئيسية" data-en="Home">
          <span class="nav-icon">⌂</span>
          <span>الرئيسية</span>
        </button>
        <button class="nav-item" type="button" data-ar="محادثاتك" data-en="Chats">
          <span class="nav-icon">▤</span>
          <span>محادثاتك</span>
        </button>
        <button class="nav-item" type="button" data-ar="استكشف" data-en="Explore">
          <span class="nav-icon">✧</span>
          <span>استكشف</span>
        </button>
      </nav>

      <div class="side-label history-label" data-ar="سجل المحادثات" data-en="Recent conversations">
        سجل المحادثات
      </div>
      <div id="history" class="history"></div>

      <div class="side-bottom">
        <button id="languageBtn" type="button">
          <span class="nav-icon">◎</span>
          <span>🌐 English</span>
        </button>
        <div class="profile">
          <div class="profile-avatar">M</div>
          <div class="profile-copy">
            <strong>AI M</strong>
            <span><i class="online-dot"></i> Assistant Online</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="فتح القائمة">☰</button>

        <div class="top-brand">
          <span class="top-brand-symbol">M</span>
          <span>AI M</span>
          <span class="top-status"></span>
        </div>

        <div class="top-actions">
          <span class="universe-label">DIGITAL UNIVERSE</span>
          <button id="clearBtn" class="icon-btn" type="button" aria-label="مسح المحادثة">⌫</button>
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="universe-caption" aria-hidden="true">
          <span class="caption-line"></span>
          <span>BEYOND THE ORDINARY</span>
          <span class="caption-line"></span>
        </div>

        <div class="welcome" id="welcome">
          <div class="core-emblem" aria-hidden="true">
            <div class="core-orbit orbit-one"></div>
            <div class="core-orbit orbit-two"></div>
            <div class="core-orbit orbit-three"></div>
            <div class="core-halo"></div>
            <div class="core-letter">M</div>
          </div>

          <div class="welcome-kicker">
            <span class="kicker-dot"></span>
            YOUR PERSONAL INTELLIGENCE
          </div>

          <h1 data-ar="مرحبًا بك في <span>AI M</span>" data-en="Welcome to <span>AI M</span>">
            مرحبًا بك في <span>AI M</span>
          </h1>

          <p class="welcome-description"
             data-ar="عالم جديد. أفكار بلا حدود. ابدأ رحلتك."
             data-en="A new universe. Limitless ideas. Begin your journey.">
            عالم جديد. أفكار بلا حدود. ابدأ رحلتك.
          </p>

          <div class="suggestions">
            <button class="suggestion" type="button"
              data-prompt-ar="اكتب لي خطة لتعلم البرمجة"
              data-prompt-en="Write me a programming learning plan">
              <span class="suggestion-icon">⌘</span>
              <span class="suggestion-copy">
                <strong>تعلم البرمجة</strong>
                <small>ابدأ ببناء أفكارك</small>
              </span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button class="suggestion" type="button"
              data-prompt-ar="اشرح لي الذكاء الاصطناعي"
              data-prompt-en="Explain artificial intelligence">
              <span class="suggestion-icon">✧</span>
              <span class="suggestion-copy">
                <strong>الذكاء الاصطناعي</strong>
                <small>اكتشف إمكانيات جديدة</small>
              </span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button class="suggestion" type="button"
              data-prompt-ar="ساعدني في كتابة مشروع"
              data-prompt-en="Help me write a project">
              <span class="suggestion-icon">⌁</span>
              <span class="suggestion-copy">
                <strong>إنشاء مشروع</strong>
                <small>حوّل فكرتك إلى واقع</small>
              </span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button class="suggestion" type="button"
              data-prompt-ar="اقترح أفكارًا جديدة"
              data-prompt-en="Suggest some new ideas">
              <span class="suggestion-icon">✳</span>
              <span class="suggestion-copy">
                <strong>أفكار جديدة</strong>
                <small>فكّر خارج الحدود</small>
              </span>
              <span class="suggestion-arrow">↗</span>
            </button>
          </div>
        </div>

        <div id="messages" class="messages"></div>
      </section>

      <footer class="composer-wrap">
        <div class="composer-aura" aria-hidden="true"></div>

        <form id="chatForm" class="composer">
          <span class="composer-mark" aria-hidden="true">✧</span>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="اكتب رسالتك إلى AI M..."
            aria-label="رسالتك"
          ></textarea>

          <button class="attach-btn" type="button" aria-label="إضافة">＋</button>
          <button id="sendBtn" type="submit" aria-label="إرسال">➤</button>
        </form>

        <p class="disclaimer"
           data-ar="AI M قد يخطئ أحيانًا؛ راجع المعلومات المهمة."
           data-en="AI M can make mistakes. Check important information.">
          AI M قد يخطئ أحيانًا؛ راجع المعلومات المهمة.
        </p>
      </footer>
    </main>
  </div>

  <script type="module" src="/room3d.js"></script>
  <script src="/app.js"></script>
</body>
</html>
