
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <meta name="description" content="AI M - Your intelligent AI assistant">
  <title>AI M — مساعدك الذكي</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">M</div>
        <span>AI M</span>
        <button id="closeSidebar" class="mobile-close">×</button>
      </div>

      <button id="newChat" class="new-chat">＋ محادثة جديدة</button>

      <div class="side-label" data-ar="محادثاتك" data-en="Your chats">محادثاتك</div>
      <div id="history" class="history"></div>

      <div class="side-bottom">
        <button id="languageBtn">🌐 English</button>
        <div class="profile">✦ AI M Assistant</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn">☰</button>
        <div class="top-title">AI M <span>●</span></div>
        <button id="clearBtn" class="icon-btn">⌫</button>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">M</div>
          <h1 data-ar="أهلاً بك في AI M" data-en="Welcome to AI M">أهلاً بك في AI M</h1>
          <p data-ar="مساعدك الذكي، مستعد لمساعدتك في أي وقت." data-en="Your intelligent assistant, ready to help anytime.">مساعدك الذكي، مستعد لمساعدتك في أي وقت.</p>

          <div class="suggestions">
            <button class="suggestion" data-prompt-ar="اكتب لي خطة لتعلم البرمجة" data-prompt-en="Write me a programming learning plan">💻 <span>تعلم البرمجة</span></button>
            <button class="suggestion" data-prompt-ar="اشرح لي الذكاء الاصطناعي" data-prompt-en="Explain artificial intelligence">🧠 <span>الذكاء الاصطناعي</span></button>
            <button class="suggestion" data-prompt-ar="ساعدني في كتابة مشروع" data-prompt-en="Help me write a project">✍️ <span>كتابة مشروع</span></button>
            <button class="suggestion" data-prompt-ar="اقترح أفكارًا جديدة" data-prompt-en="Suggest new ideas">💡 <span>أفكار جديدة</span></button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </section>

      <footer class="composer-wrap">
        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك"></textarea>
          <button id="sendBtn" type="submit" aria-label="إرسال">➤</button>
        </form>
        <p class="disclaimer" data-ar="قد يخطئ AI M. راجع المعلومات المهمة." data-en="AI M can make mistakes. Check important information.">قد يخطئ AI M. راجع المعلومات المهمة.</p>
      </footer>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
